# ==============================================================================
# TaskManager Production Redis Configuration (Durability & Zero Data Loss)
# ==============================================================================

# 1. Network & General
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 2. Durability: AOF (Append-Only File)
# Guarantees that every write command (enqueued jobs, crons, DLQ) is flushed to disk
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 3. Memory Safety & Eviction Policy
# Never silently drop jobs or queue state when memory limit is reached
maxmemory-policy noeviction

# 4. RDB Snapshots (Secondary Recovery Layer)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

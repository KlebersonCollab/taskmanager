[project]
name = "taskmanager-engine"
version = "0.1.2"
description = "High-performance background task execution engine with dynamic cron scheduling and Linear-themed SPA dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.6.0",
    "croniter>=2.0.0",
    "psutil>=5.9.0",
    "fakeredis>=2.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.21.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.scripts]
taskmanager = "taskmanager.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["taskmanager*"]

[tool.setuptools.package-data]
"taskmanager.ui" = ["*.html", "*.css", "*.js", "*.svg", "*.ico", "*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
